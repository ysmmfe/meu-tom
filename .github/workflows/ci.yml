name: Quality
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meutom
          POSTGRES_PASSWORD: meutom
          POSTGRES_DB: meutom
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U meutom" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://meutom:meutom@localhost:5434/meutom
      E2E_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate && npm run db:seed && npm run db:seed && npx tsx scripts/seed-index-test.ts
      - run: npm run format:check
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
