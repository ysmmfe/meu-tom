services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meutom
      POSTGRES_PASSWORD: meutom
      POSTGRES_DB: meutom
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - meutom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meutom"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  meutom-data:
